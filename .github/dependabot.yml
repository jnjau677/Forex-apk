# Dependabot configuration.
# NOTE: this file previously contained a CodeQL workflow by mistake, which made the
# Dependabot config invalid. CodeQL scanning lives in .github/workflows/codeql.yml.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
