name: Android CI / CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test_and_build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # No Gradle wrapper is committed yet, so ./gradlew cannot run. Install the
      # minimum Gradle version required by AGP 9.1.1 directly.
      # TODO: commit the wrapper ("gradle wrapper --gradle-version 9.3.1") and drop this pin.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env Configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FCS_API_KEY: ${{ secrets.FCS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          touch .env
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env; fi
          if [ -n "$FCS_API_KEY" ]; then echo "FCS_API_KEY=$FCS_API_KEY" >> .env; fi
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> .env; fi
          if [ -n "$ALPHAVANTAGE_API_KEY" ]; then echo "ALPHAVANTAGE_API_KEY=$ALPHAVANTAGE_API_KEY" >> .env; fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release_build:
    name: Build Production Release (AAB & APK)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test_and_build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Fail fast with an actionable message instead of an obscure Gradle signing error.
      - name: Verify Release Signing Secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are not fully configured."
            echo "::error::Set RELEASE_KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

      - name: Create .env Configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FCS_API_KEY: ${{ secrets.FCS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          touch .env
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env; fi
          if [ -n "$FCS_API_KEY" ]; then echo "FCS_API_KEY=$FCS_API_KEY" >> .env; fi
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> .env; fi
          if [ -n "$ALPHAVANTAGE_API_KEY" ]; then echo "ALPHAVANTAGE_API_KEY=$ALPHAVANTAGE_API_KEY" >> .env; fi

      - name: Build Release Bundle (AAB) & APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle bundleRelease assembleRelease

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
