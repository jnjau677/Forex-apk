# Dependency graph submission: enables Dependabot alerts for Gradle dependencies.
# The duplicate "build" job was removed: android_ci.yml already builds and tests on
# every push and pull request, so this workflow now only performs dependency analysis.

name: Gradle Dependency Submission

on:
  push:
    branches: [ "main" ]

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # No Gradle wrapper is committed yet; install the version required by AGP 9.1.1
      # and generate the wrapper so the dependency-submission action can run it.
      # TODO: commit the wrapper and drop this pin + generation step.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
